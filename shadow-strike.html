<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Strike</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#080812;
    color:white;
    font-family:Arial;
    text-align:center;
}

header{
    padding:15px;
    background:#111122;
    border-bottom:2px solid #00eaff;
}

canvas{
    background:#0b0b18;
    border:2px solid #00eaff;
    width:95%;
    max-width:900px;
    margin:15px auto;
    display:block;
}

button{
    padding:12px 18px;
    margin:5px;
    background:#15152b;
    color:white;
    border:1px solid #00eaff;
    border-radius:8px;
}

button:active{
    background:#00eaff;
    color:black;
}

#gameOver{
    display:none;
    position:fixed;
    inset:0;
    background:#000c;
    align-items:center;
    justify-content:center;
}

.box{
    background:#15152b;
    padding:30px;
    border-radius:15px;
}
</style>
</head>

<body>

<header>
<h2>⚔️ SHADOW STRIKE</h2>
<p>Score: <span id="score">0</span> | ❤️ <span id="health">100</span></p>
</header>

<canvas id="gameCanvas" width="900" height="550"></canvas>

<div>
<button id="up">⬆️</button><br>
<button id="left">⬅️</button>
<button id="attack">⚔️</button>
<button id="right">➡️</button><br>
<button id="down">⬇️</button>
</div>

<div id="gameOver">
<div class="box">
<h2>GAME OVER</h2>
<p>Score: <span id="finalScore">0</span></p>
<button onclick="location.reload()">🔄 Restart</button>
<button onclick="location.href='../index.html'">🏠 Home</button>
</div>
</div>

<script src="shadow-strike.js"></script>

</body>
</html>
