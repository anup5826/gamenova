<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>War Lords - GameNova</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#05060a;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
    touch-action:none;
}

.game-wrap{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

/* TOP BAR */

.topbar{
    width:min(1000px,96vw);
    min-height:48px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:8px 14px;

    background:rgba(15,18,28,.96);

    border:1px solid #333a4d;
    border-radius:12px 12px 0 0;

    box-shadow:
        0 0 20px rgba(255,190,50,.08);

    font-size:14px;
}

.title{
    color:#ffd23f;
    font-weight:bold;
    letter-spacing:1px;
    text-shadow:0 0 10px rgba(255,210,63,.45);
}

.stats{
    display:flex;
    gap:14px;
    align-items:center;
}

/* CANVAS */

canvas{
    display:block;

    width:min(1000px,96vw);
    height:auto;

    max-height:70vh;

    background:#161922;

    border-left:1px solid #333a4d;
    border-right:1px solid #333a4d;

    box-shadow:
        0 0 30px rgba(0,0,0,.5);
}

/* BOTTOM */

.bottom{
    width:min(1000px,96vw);

    background:rgba(12,14,21,.98);

    padding:8px;

    border:1px solid #333a4d;
    border-radius:0 0 12px 12px;

    text-align:center;
}

.main-menu{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    padding:7px 18px;
    margin-bottom:6px;

    background:#171b27;

    color:#ffd23f;

    border:1px solid #ffd23f;

    border-radius:8px;

    font-weight:bold;

    transition:.2s;
}

.main-menu:hover{
    background:#ffd23f;
    color:#111;

    box-shadow:
        0 0 15px rgba(255,210,63,.4);
}

/* CONTROLS */

.controls{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.control{
    min-width:48px;
    height:40px;

    border:1px solid #555c70;

    background:#242936;

    color:white;

    border-radius:8px;

    font-size:18px;
    font-weight:bold;

    user-select:none;
    -webkit-user-select:none;
}

.control:active{
    transform:scale(.94);
    background:#343b4d;
}

.attack{
    background:#74252b;
    border-color:#ff5555;

    min-width:100px;

    box-shadow:
        0 0 12px rgba(255,60,60,.15);
}

.pause{
    background:#263552;
    border-color:#6fa8ff;
}

/* OVERLAY */

.overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.82);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:10;
}

.panel{
    width:min(440px,90vw);

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #171b28,
            #0d1018
        );

    border:1px solid #ffd23f;

    border-radius:18px;

    padding:28px;

    box-shadow:
        0 0 40px rgba(255,210,63,.18);
}

.panel h1{
    color:#ffd23f;

    margin-bottom:14px;

    text-shadow:
        0 0 12px rgba(255,210,63,.35);
}

.panel p{
    color:#ddd;

    line-height:1.6;

    margin:8px 0;
}

.panel button{
    margin-top:16px;

    padding:12px 28px;

    border:0;

    border-radius:9px;

    background:#ffd23f;

    color:#111;

    font-weight:bold;

    font-size:16px;

    cursor:pointer;

    box-shadow:
        0 0 15px rgba(255,210,63,.2);
}

/* MOBILE */

@media(max-width:600px){

    .topbar{
        font-size:11px;
        padding:7px 9px;
    }

    .title{
        font-size:11px;
    }

    .stats{
        gap:6px;
    }

    canvas{
        max-height:58vh;
    }

    .control{
        height:38px;
        min-width:44px;
        font-size:16px;
    }

    .attack{
        min-width:88px;
    }
}
</style>
</head>

<body>

<div class="game-wrap">

    <!-- TOP BAR -->

    <div class="topbar">

        <div class="title">
            ⚔️ WAR LORDS
        </div>

        <div class="stats">

            <div>
                LEVEL:
                <b id="levelText">1</b>/5
            </div>

            <div>
                ❤️
                <b id="healthText">100</b>
            </div>

            <div>
                🏆
                <b id="scoreText">0</b>
            </div>

            <div>
                🪙
                <b id="coinText">0</b>
            </div>

        </div>

    </div>


    <!-- GAME -->

    <canvas
        id="game"
        width="1000"
        height="560">
    </canvas>


    <!-- BOTTOM -->

    <div class="bottom">

        <a
            class="main-menu"
            href="../index.html">
            🏠 MAIN MENU
        </a>

        <div class="controls">

            <button
                class="control"
                id="up">
                ⬆️
            </button>

            <button
                class="control"
                id="left">
                ⬅️
            </button>

            <button
                class="control"
                id="down">
                ⬇️
            </button>

            <button
                class="control"
                id="right">
                ➡️
            </button>

            <button
                class="control attack"
                id="attack">
                ⚔️ ATTACK
            </button>

            <button
                class="control pause"
                id="pause">
                ⏸️
            </button>

        </div>

    </div>

</div>


<!-- OVERLAY -->

<div
    class="overlay"
    id="overlay">

    <div class="panel">

        <h1 id="panelTitle">
            LEVEL COMPLETE!
        </h1>

        <p id="panelText">
            You defeated all enemies.
        </p>

        <button id="panelButton">
            NEXT LEVEL
        </button>

    </div>

</div>


<script>

/* =========================================
   CANVAS
========================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


/* =========================================
   UI
========================================= */

const levelText =
    document.getElementById("levelText");

const healthText =
    document.getElementById("healthText");

const scoreText =
    document.getElementById("scoreText");

const coinText =
    document.getElementById("coinText");

const overlay =
    document.getElementById("overlay");

const panelTitle =
    document.getElementById("panelTitle");

const panelText =
    document.getElementById("panelText");

const panelButton =
    document.getElementById("panelButton");


/* =========================================
   LEVEL SETTINGS
========================================= */

const LEVELS = [

    {
        name:"Training Ground",
        enemies:4,
        speed:.65,
        health:35,
        damage:.12,
        boss:false,
        bg:"#315238"
    },

    {
        name:"Enemy Camp",
        enemies:6,
        speed:.9,
        health:45,
        damage:.17,
        boss:false,
        bg:"#46382d"
    },

    {
        name:"Dark Battlefield",
        enemies:8,
        speed:1.1,
        health:55,
        damage:.21,
        boss:false,
        bg:"#20273c"
    },

    {
        name:"War Castle",
        enemies:10,
        speed:1.35,
        health:70,
        damage:.26,
        boss:false,
        bg:"#30222e"
    },

    {
        name:"Final War",
        enemies:7,
        speed:1.5,
        health:80,
        damage:.31,
        boss:true,
        bg:"#401c25"
    }

];


/* =========================================
   GAME STATE
========================================= */

let level = 1;

let score = 0;

let coins = 0;

let gameRunning = true;

let paused = false;

let attackTimer = 0;

let hitEffectTimer = 0;


/* =========================================
   PLAYER
========================================= */

const player = {

    x:500,
    y:300,

    width:32,
    height:44,

    speed:3.7,

    health:100,

    facing:1,

    attackPower:30

};


/* =========================================
   KEYBOARD
========================================= */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        keys[e.key.toLowerCase()] = true;

        if(e.code === "Space"){
            e.preventDefault();
            attack();
        }

        if(e.key.toLowerCase() === "p"){
            togglePause();
        }

    }
);


window.addEventListener(
    "keyup",
    e => {

        keys[e.key.toLowerCase()] = false;

    }
);


/* =========================================
   ENEMIES
========================================= */

let enemies = [];


/* =========================================
   PARTICLES
========================================= */

let particles = [];


/* =========================================
   CREATE PARTICLES
========================================= */

function createParticles(
    x,
    y,
    amount=8,
    type="hit"
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push({

            x:x,
            y:y,

            vx:
                (Math.random()-.5)*5,

            vy:
                (Math.random()-.5)*5,

            life:
                25 + Math.random()*20,

            maxLife:45,

            size:
                2 + Math.random()*4,

            type:type

        });

    }

}


/* =========================================
   UPDATE PARTICLES
========================================= */

function updateParticles(){

    particles.forEach(p => {

        p.x += p.vx;

        p.y += p.vy;

        p.vx *= .96;

        p.vy *= .96;

        p.life--;

    });

    particles =
        particles.filter(
            p => p.life>0
        );

}


/* =========================================
   DRAW PARTICLES
========================================= */

function drawParticles(){

    particles.forEach(p => {

        ctx.globalAlpha =
            Math.max(
                0,
                p.life/p.maxLife
            );

        ctx.fillStyle =
            p.type === "coin"
            ? "#ffd23f"
            : "#ff684d";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    });

    ctx.globalAlpha=1;

}


/* =========================================
   CREATE ENEMIES
========================================= */

function createEnemies(){

    enemies=[];

    const data =
        LEVELS[level-1];


    for(
        let i=0;
        i<data.enemies;
        i++
    ){

        const boss =
            data.boss && i===0;


        let x;
        let y;

        do{

            x =
                70 +
                Math.random()*860;

            y =
                90 +
                Math.random()*390;

        }while(
            Math.hypot(
                x-player.x,
                y-player.y
            ) < 170
        );


        enemies.push({

            x:x,
            y:y,

            width:
                boss ? 72 : 34,

            height:
                boss ? 82 : 45,

            speed:
                boss
                ? data.speed*.65
                : data.speed,

            health:
                boss
                ? 420
                : data.health,

            maxHealth:
                boss
                ? 420
                : data.health,

            damage:
                boss
                ? data.damage*1.6
                : data.damage,

            boss:boss,

            hitFlash:0,

            attackCooldown:0,

            wobble:
                Math.random()*Math.PI*2

        });

    }

}


/* =========================================
   BACKGROUND
========================================= */

function drawBackground(){

    const data =
        LEVELS[level-1];


    ctx.fillStyle=data.bg;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* grid */

    ctx.strokeStyle =
        "rgba(255,255,255,.055)";

    ctx.lineWidth=1;


    for(
        let x=0;
        x<canvas.width;
        x+=50
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();

    }


    for(
        let y=0;
        y<canvas.height;
        y+=50
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();

    }


    /* battlefield stones */

    for(
        let i=0;
        i<18;
        i++
    ){

        const x =
            (i*137)%canvas.width;

        const y =
            (i*83)%canvas.height;


        ctx.fillStyle =
            "rgba(0,0,0,.18)";

        ctx.beginPath();

        ctx.ellipse(
            x,
            y,
            22,
            10,
            .3,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* castle walls on level 4 */

    if(level===4){

        ctx.fillStyle =
            "rgba(10,10,15,.25)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            55
        );

        ctx.fillRect(
            0,
            canvas.height-45,
            canvas.width,
            45
        );

        for(
            let x=20;
            x<canvas.width;
            x+=70
        ){

            ctx.fillRect(
                x,
                0,
                40,
                18
            );

        }

    }


    /* boss arena */

    if(level===5){

        ctx.strokeStyle =
            "rgba(255,60,60,.12)";

        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            500,
            300,
            210,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }

}


/* =========================================
   DRAW PLAYER
========================================= */

function drawPlayer(){

    const p=player;

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );


    /* shadow */

    ctx.fillStyle =
        "rgba(0,0,0,.38)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        20,
        25,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* legs */

    ctx.fillStyle="#1b1e27";

    ctx.fillRect(
        -14,
        7,
        10,
        23
    );

    ctx.fillRect(
        4,
        7,
        10,
        23
    );


    /* boots */

    ctx.fillStyle="#101218";

    ctx.fillRect(
        -16,
        26,
        13,
        6
    );

    ctx.fillRect(
        3,
        26,
        13,
        6
    );


    /* body armor */

    ctx.fillStyle="#667181";

    ctx.fillRect(
        -18,
        -14,
        36,
        28
    );


    /* armor center */

    ctx.fillStyle="#b7c0ca";

    ctx.fillRect(
        -9,
        -11,
        18,
        21
    );


    /* armor symbol */

    ctx.fillStyle="#ffd23f";

    ctx.fillRect(
        -3,
        -7,
        6,
        13
    );


    /* head */

    ctx.fillStyle="#d69b70";

    ctx.beginPath();

    ctx.arc(
        0,
        -28,
        14,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* helmet */

    ctx.fillStyle="#303743";

    ctx.beginPath();

    ctx.arc(
        0,
        -30,
        15,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillRect(
        -15,
        -30,
        30,
        7
    );


    /* eye */

    ctx.fillStyle="#ffdd55";

    ctx.fillRect(
        p.facing*6,
        -28,
        4,
        3
    );


    /* sword */

    ctx.save();


    if(p.facing<0){

        ctx.scale(
            -1,
            1
        );

    }


    ctx.rotate(
        attackTimer>0
        ? -1.0
        : -.35
    );


    /* handle */

    ctx.fillStyle="#563c22";

    ctx.fillRect(
        5,
        -2,
        12,
        5
    );


    /* guard */

    ctx.fillStyle="#ffd23f";

    ctx.fillRect(
        14,
        -9,
        6,
        18
    );


    /* blade */

    ctx.fillStyle="#e5edf5";

    ctx.fillRect(
        18,
        -4,
        45,
        5
    );


    /* blade shine */

    ctx.fillStyle="#ffffff";

    ctx.fillRect(
        22,
        -3,
        35,
        1
    );


    ctx.restore();


    /* attack slash */

    if(attackTimer>0){

        ctx.strokeStyle=
            "rgba(255,230,100,.9)";

        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            67,
            -.9,
            .55
        );

        ctx.stroke();

    }


    ctx.restore();


    /* player HP */

    const hp =
        Math.max(
            0,
            p.health/100
        );


    ctx.fillStyle="#111";

    ctx.fillRect(
        p.x-30,
        p.y-65,
        60,
        8
    );


    ctx.fillStyle="#43e06f";

    ctx.fillRect(
        p.x-30,
        p.y-65,
        60*hp,
        8
    );

}


/* =========================================
   DRAW ENEMY
========================================= */

function drawEnemy(e){

    ctx.save();

    ctx.translate(
        e.x,
        e.y
    );


    if(e.hitFlash>0){

        ctx.globalAlpha=.65;

    }


    /* shadow */

    ctx.fillStyle =
        "rgba(0,0,0,.42)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        e.height/2-2,
        e.width*.48,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* legs */

    ctx.fillStyle="#11131a";

    ctx.fillRect(
        -e.width*.3,
        e.height*.05,
        e.width*.18,
        e.height*.45
    );

    ctx.fillRect(
        e.width*.12,
        e.height*.05,
        e.width*.18,
        e.height*.45
    );


    /* body */

    ctx.fillStyle =
        e.boss
        ? "#701c32"
        : "#572832";

    ctx.fillRect(
        -e.width/2,
        -e.height*.15,
        e.width,
        e.height*.5
    );


    /* armor */

    ctx.fillStyle =
        e.boss
        ? "#ad8135"
        : "#812d39";

    ctx.fillRect(
        -e.width*.31,
        -e.height*.12,
        e.width*.62,
        e.height*.35
    );


    /* head */

    ctx.fillStyle="#b86e52";

    ctx.beginPath();

    ctx.arc(
        0,
        -e.height*.39,
        e.width*.30,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* helmet */

    ctx.fillStyle =
        e.boss
        ? "#b69b58"
        : "#252832";

    ctx.beginPath();

    ctx.arc(
        0,
        -e.height*.43,
        e.width*.33,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /* horns for boss */

    if(e.boss){

        ctx.fillStyle="#8e1f2d";

        ctx.beginPath();

        ctx.moveTo(
            -e.width*.27,
            -e.height*.57
        );

        ctx.lineTo(
            -e.width*.48,
            -e.height*.78
        );

        ctx.lineTo(
            -e.width*.12,
            -e.height*.64
        );

        ctx.fill();


        ctx.beginPath();

        ctx.moveTo(
            e.width*.27,
            -e.height*.57
        );

        ctx.lineTo(
            e.width*.48,
            -e.height*.78
        );

        ctx.lineTo(
            e.width*.12,
            -e.height*.64
        );

        ctx.fill();

    }


    /* eyes */

    ctx.fillStyle="#ff3838";

    ctx.fillRect(
        -e.width*.18,
        -e.height*.39,
        5,
        3
    );

    ctx.fillRect(
        e.width*.05,
        -e.height*.39,
        5,
        3
    );


    /* weapon */

    ctx.strokeStyle =
        e.boss
        ? "#ffd23f"
        : "#cfd5dd";

    ctx.lineWidth =
        e.boss ? 7 : 4;

    ctx.beginPath();

    ctx.moveTo(
        e.width*.25,
        0
    );

    ctx.lineTo(
        e.width*.72,
        -e.height*.36
    );

    ctx.stroke();


    ctx.restore();


    ctx.globalAlpha=1;


    /* enemy HP */

    ctx.fillStyle="#111";

    ctx.fillRect(
        e.x-e.width/2,
        e.y-e.height/2-17,
        e.width,
        7
    );


    ctx.fillStyle =
        e.boss
        ? "#ffd23f"
        : "#ef4747";

    ctx.fillRect(
        e.x-e.width/2,
        e.y-e.height/2-17,
        e.width*
        Math.max(
            0,
            e.health/e.maxHealth
        ),
        7
    );


    /* boss title */

    if(e.boss){

        ctx.fillStyle="#ffd23f";

        ctx.font=
            "bold 16px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            "👑 BOSS LORD",
            e.x,
            e.y-e.height/2-26
        );

    }

}


/* =========================================
   PLAYER MOVEMENT
========================================= */

function movePlayer(){

    let dx=0;
    let dy=0;


    if(
        keys["w"] ||
        keys["arrowup"]
    ){
        dy=-1;
    }


    if(
        keys["s"] ||
        keys["arrowdown"]
    ){
        dy=1;
    }


    if(
        keys["a"] ||
        keys["arrowleft"]
    ){

        dx=-1;

        player.facing=-1;

    }


    if(
        keys["d"] ||
        keys["arrowright"]
    ){

        dx=1;

        player.facing=1;

    }


    if(
        dx!==0 ||
        dy!==0
    ){

        const len =
            Math.hypot(
                dx,
                dy
            );


        dx/=len;
        dy/=len;


        player.x +=
            dx*player.speed;

        player.y +=
            dy*player.speed;

    }


    /* boundaries */

    player.x =
        Math.max(
            35,
            Math.min(
                canvas.width-35,
                player.x
            )
        );


    player.y =
        Math.max(
            65,
            Math.min(
                canvas.height-35,
                player.y
            )
        );

}


/* =========================================
   ATTACK
========================================= */

function attack(){

    if(!gameRunning || paused)
        return;

    if(attackTimer>0)
        return;


    attackTimer=15;

    let hitSomething=false;


    enemies.forEach(e=>{

        const dx =
            e.x-player.x;

        const dy =
            e.y-player.y;

        const distance =
            Math.hypot(
                dx,
                dy
            );


        const range =
            e.boss
            ? 115
            : 88;


        if(distance<range){

            const damage =
                e.boss
                ? 20
                : player.attackPower;


            e.health -= damage;

            e.hitFlash=6;

            hitSomething=true;


            createParticles(
                e.x,
                e.y,
                e.boss ? 15 : 8,
                "hit"
            );


            if(e.health<=0){

                score +=
                    e.boss
                    ? 600
                    : 100;

                coins +=
                    e.boss
                    ? 10
                    : 2;


                createParticles(
                    e.x,
                    e.y,
                    e.boss ? 25 : 12,
                    "coin"
                );

            }

        }

    });


    if(hitSomething){

        hitEffectTimer=5;

    }

}


/* =========================================
   ENEMY UPDATE
========================================= */

function updateEnemies(){

    enemies.forEach(e=>{

        const dx =
            player.x-e.x;

        const dy =
            player.y-e.y;

        const distance =
            Math.hypot(
                dx,
                dy
            );


        if(distance>48){

            e.x +=
                (dx/distance)*
                e.speed;

            e.y +=
                (dy/distance)*
                e.speed;

        }
        else{

            if(e.attackCooldown<=0){

                player.health -=
                    e.damage;

                e.attackCooldown =
                    e.boss ? 35 : 45;

                createParticles(
                    player.x,
                    player.y,
                    5,
                    "hit"
                );

            }

        }


        if(e.attackCooldown>0){

            e.attackCooldown--;

        }


        if(e.hitFlash>0){

            e.hitFlash--;

        }

    });


    enemies =
        enemies.filter(
            e => e.health>0
        );

}


/* =========================================
   LEVEL COMPLETE
========================================= */

function levelComplete(){

    gameRunning=false;

    if(level<5){

        panelTitle.textContent=
            "⚔️ LEVEL COMPLETE!";

        panelText.innerHTML=
            `<b>${LEVELS[level-1].name}</b><br>
             🏆 Score: ${score}<br>
             🪙 Coins: ${coins}<br><br>
             Get ready for Level ${level+1}!`;

        panelButton.textContent=
            "NEXT LEVEL ➡️";

        panelButton.onclick=
            nextLevel;

    }
    else{

        panelTitle.textContent=
            "👑 WAR LORD DEFEATED!";

        panelText.innerHTML=
            `You conquered all 5 battlefields!<br><br>
             🏆 Final Score: <b>${score}</b><br>
             🪙 Coins: <b>${coins}</b>`;

        panelButton.textContent=
            "PLAY AGAIN 🔥";

        panelButton.onclick=
            restartGame;

    }


    overlay.style.display="flex";

}


/* =========================================
   NEXT LEVEL
========================================= */

function nextLevel(){

    level++;

    player.health=100;

    player.x=500;
    player.y=300;

    attackTimer=0;

    particles=[];

    createEnemies();

    gameRunning=true;

    paused=false;

    overlay.style.display="none";

    updateUI();

}


/* =========================================
   GAME OVER
========================================= */

function gameOver(){

    gameRunning=false;

    panelTitle.textContent=
        "💀 GAME OVER";

    panelText.innerHTML=
        `You reached Level ${level}.<br><br>
         🏆 Score: <b>${score}</b><br>
         🪙 Coins: <b>${coins}</b>`;

    panelButton.textContent=
        "RESTART 🔄";

    panelButton.onclick=
        restartGame;

    overlay.style.display="flex";

}


/* =========================================
   RESTART
========================================= */

function restartGame(){

    level=1;

    score=0;

    coins=0;

    player.health=100;

    player.x=500;

    player.y=300;

    player.facing=1;

    attackTimer=0;

    particles=[];

    gameRunning=true;

    paused=false;

    overlay.style.display="none";

    createEnemies();

    updateUI();

}


/* =========================================
   PAUSE
========================================= */

function togglePause(){

    if(!gameRunning)
        return;


    paused=!paused;


    if(paused){

        panelTitle.textContent=
            "⏸️ GAME PAUSED";

        panelText.textContent=
            "Press P or the Pause button to continue.";

        panelButton.textContent=
            "RESUME ▶️";

        panelButton.onclick=
            togglePause;

        overlay.style.display="flex";

    }
    else{

        overlay.style.display="none";

    }

}


/* =========================================
   UI UPDATE
========================================= */

function updateUI(){

    levelText.textContent=
        level;

    healthText.textContent=
        Math.max(
            0,
            Math.floor(
                player.health
            )
        );

    scoreText.textContent=
        score;

    coinText.textContent=
        coins;

}


/* =========================================
   MOBILE CONTROLS
========================================= */

function holdButton(
    button,
    key
){

    button.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            keys[key]=true;

        }
    );


    button.addEventListener(
        "pointerup",
        e=>{

            e.preventDefault();

            keys[key]=false;

        }
    );


    button.addEventListener(
        "pointercancel",
        ()=>{
            keys[key]=false;
        }
    );


    button.addEventListener(
        "pointerleave",
        ()=>{
            keys[key]=false;
        }
    );

}


holdButton(
    document.getElementById("up"),
    "arrowup"
);


holdButton(
    document.getElementById("down"),
    "arrowdown"
);


holdButton(
    document.getElementById("left"),
    "arrowleft"
);


holdButton(
    document.getElementById("right"),
    "arrowright"
);


/* attack */

document
.getElementById("attack")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        attack();

    }
);


/* pause */

document
.getElementById("pause")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        togglePause();

    }
);


/* =========================================
   DRAW LEVEL INFO
========================================= */

function drawLevelInfo(){

    ctx.fillStyle=
        "rgba(255,255,255,.85)";

    ctx.font=
        "bold 18px Arial";

    ctx.textAlign="left";

    ctx.fillText(
        LEVELS[level-1].name,
        20,
        30
    );


    if(level===5){

        ctx.fillStyle=
            "rgba(255,210,63,.9)";

        ctx.font=
            "bold 14px Arial";

        ctx.fillText(
            "FINAL BATTLE",
            20,
            50
        );

    }

}


/* =========================================
   GAME LOOP
========================================= */

function gameLoop(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawBackground();


    if(
        gameRunning &&
        !paused
    ){

        movePlayer();

        updateEnemies();

        updateParticles();


        if(attackTimer>0){

            attackTimer--;

        }


        if(hitEffectTimer>0){

            hitEffectTimer--;

        }


        if(player.health<=0){

            player.health=0;

            gameOver();

        }


        if(
            enemies.length===0 &&
            gameRunning
        ){

            levelComplete();

        }

    }


    /* draw objects */

    enemies.forEach(
        drawEnemy
    );

    drawParticles();

    drawPlayer();

    drawLevelInfo();

    updateUI();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================
   START
========================================= */

createEnemies();

updateUI();

gameLoop();

</script>
